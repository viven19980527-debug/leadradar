name: build-ipa

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version || true

      - name: Verify project structure
        run: python3 tools/check_pbxproj.py

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project LeadRadar.xcodeproj \
            -scheme LeadRadar \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log
          echo "----- errors -----"
          grep -nE "error:" build.log || echo "(no error)"

      - name: Package IPA
        run: |
          set -e
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry LeadRadar-unsigned.ipa Payload
          ls -lh LeadRadar-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeadRadar-unsigned-ipa
          path: LeadRadar-unsigned.ipa
          if-no-files-found: error

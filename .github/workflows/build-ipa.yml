name: build-ipa

# 在没有 Mac 的情况下，用 GitHub 的 macOS 跑一次编译，产出未签名的 .ipa
# 推上去就会自动跑；也可以在 Actions 页面点 "Run workflow" 手动触发。

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version || true
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Verify project structure
        run: python3 tools/check_pbxproj.py

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project LeadRadar.xcodeproj \
            -scheme LeadRadar \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log
          echo "----- 编译错误 -----"
          grep -nE "(error|错误):" build.log || echo "(无 error)"

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/LeadRadar.app
          test -d "$APP" || { echo "::error::没有产物，看上面 build.log 的报错"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry LeadRadar-unsigned.ipa Payload
          ls -lh LeadRadar-unsigned.ipa
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist" || true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LeadRadar-unsigned-ipa
          path: LeadRadar-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
